<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - Municipal Management</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="brand">Municipal Admin</div>
            <ul>
                <li><a href="admin.html">Dashboard & Map</a></li>
                <li><a href="admin-complaints.html">Complaints</a></li>
                <li><a href="admin-workers.html">Workers</a></li>
                <li><a href="admin-departments.html" class="active">Departments</a></li>
                <li><a href="assets.html">Assets</a></li>
                <li style="margin-top: 50px;"><a href="index.html" style="color: #ef4444;">Logout</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <header class="header">
                <h2>Department Management</h2>
                <div class="user-info">Logged in as <strong>Admin</strong></div>
            </header>
            
            <div class="content-body">
                <div class="card">
                    <div class="card-header">All Departments</div>
                    <div class="table-responsive">
                        <table id="deptsTable">
                            <thead>
                                <tr>
                                    <th>Department ID</th>
                                    <th>Name</th>
                                    <th>Head</th>
                                    <th>Worker Count</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="js/data-service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.dataService.loadInitialData();
            const depts = await window.dataService.getDepartments();
            let html = '';
            depts.forEach(d => {
                html += `
                    <tr>
                        <td><strong>${d.id}</strong></td>
                        <td>${d.name}</td>
                        <td>${d.head}</td>
                        <td>${d.workerCount}</td>
                    </tr>
                `;
            });
            document.querySelector('#deptsTable tbody').innerHTML = html;
        });
    </script>
</body>
</html>
