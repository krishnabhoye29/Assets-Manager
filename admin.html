<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Municipal Management</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .zone-panel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 350px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .zone-panel.active {
            display: block;
        }
        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="brand">Municipal Admin</div>
            <ul>
                <li><a href="#" class="active">Dashboard & Map</a></li>
                <li><a href="admin-complaints.html">Complaints</a></li>
                <li><a href="admin-workers.html">Workers</a></li>
                <li><a href="admin-departments.html">Departments</a></li>
                <li><a href="assets.html">Assets</a></li>
                <li style="margin-top: 50px;"><a href="index.html" style="color: #ef4444;">Logout</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <header class="header">
                <h2>Overview Dashboard</h2>
                <div class="user-info">Logged in as <strong>Admin</strong></div>
            </header>
            
            <div class="content-body">
                <div class="stat-cards" id="adminStats">
                    <!-- Stats loaded via JS -->
                </div>
                
                <div class="card">
                    <div class="card-header">Interactive Zone Map</div>
                    
                    <div class="filter-bar">
                        <div class="filter-group">
                            <label>Map View Mode</label>
                            <select id="mapViewMode">
                                <option>Total Complaints</option>
                                <option>Pending</option>
                                <option>Under Process</option>
                                <option>Resolved</option>
                                <option>Critical Complaints</option>
                                <option>Resolution Rate</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Complaint Status</label>
                            <select id="filterStatus">
                                <option value="All">All</option>
                                <option value="Pending">Pending</option>
                                <option value="Under Process">Under Process</option>
                                <option value="Resolved">Resolved</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Department</label>
                            <select id="filterDepartment">
                                <option value="All">All</option>
                                <option value="Streetlight Department">Streetlight</option>
                                <option value="Roads Department">Roads</option>
                                <option value="Footpath Department">Footpath</option>
                                <option value="Water & Sewage Department">Water & Sewage</option>
                                <option value="Sanitation Department">Sanitation</option>
                                <option value="Public Facilities Department">Public Facilities</option>
                                <option value="Safety Department">Safety</option>
                                <option value="General Maintenance">General Maintenance</option>
                            </select>
                        </div>
                    </div>
                    
                    <div id="map"></div>
                </div>
                
                <div class="card">
                    <div class="card-header">Top Complaint Zones</div>
                    <div id="topZonesList"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Zone Details Panel -->
    <div id="zonePanel" class="zone-panel">
        <span class="close-btn" onclick="document.getElementById('zonePanel').classList.remove('active')">&times;</span>
        <h2 id="zpName" style="margin-bottom: 10px;">Zone Name</h2>
        <div style="margin-bottom: 20px; display: flex; gap: 10px;">
            <input type="text" id="renameZoneInput" placeholder="New Zone Name" style="flex:1; padding: 5px;">
            <button class="btn btn-secondary" onclick="renameCurrentZone()" style="padding: 5px 10px;">Rename</button>
        </div>
        
        <div class="stat-cards" style="grid-template-columns: 1fr 1fr; margin-bottom: 20px;">
            <div class="stat-card" style="padding: 10px;">
                <h3 style="margin-bottom: 5px;">Total</h3>
                <div class="value" id="zpTotal" style="font-size: 1.2rem;">0</div>
            </div>
            <div class="stat-card" style="padding: 10px;">
                <h3 style="margin-bottom: 5px;">Pending</h3>
                <div class="value" id="zpPending" style="font-size: 1.2rem; color: var(--status-pending);">0</div>
            </div>
            <div class="stat-card" style="padding: 10px;">
                <h3 style="margin-bottom: 5px;">Under Process</h3>
                <div class="value" id="zpProcess" style="font-size: 1.2rem; color: var(--status-process);">0</div>
            </div>
            <div class="stat-card" style="padding: 10px;">
                <h3 style="margin-bottom: 5px;">Resolved</h3>
                <div class="value" id="zpResolved" style="font-size: 1.2rem; color: var(--status-resolved);">0</div>
            </div>
        </div>
        
        <div style="margin-bottom: 20px;">
            <h4>Resolution Rate: <span id="zpResRate">0</span>%</h4>
        </div>
        
        <div style="margin-bottom: 20px;">
            <h4>Categories Breakdown</h4>
            <canvas id="zoneChart" width="300" height="200"></canvas>
        </div>
        
        <button class="btn btn-primary" style="width: 100%;" onclick="viewZoneComplaints()">View Zone Complaints</button>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/data-service.js"></script>
    <script src="js/map.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
